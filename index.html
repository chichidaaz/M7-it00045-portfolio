<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M5 Features</title>

    <!-- Check the saved theme before loading the styles. -->
    <script>
        var settingsKey = "portfolioSettings";

        try {
            var savedSettings = localStorage.getItem(settingsKey);

            if (savedSettings) {
                var settings = JSON.parse(savedSettings);

                if (settings && settings.theme === "dark") {
                    document.documentElement.dataset.theme = "dark";
                } else {
                    document.documentElement.dataset.theme = "light";
                }
            } else {
                document.documentElement.dataset.theme = "light";
            }
        } catch (error) {
            document.documentElement.dataset.theme = "light";
        }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header id="home">
        <h1>My Website</h1>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
            Menu
        </button>

        <nav class="nav-menu" id="site-navigation">
            <a href="#home">Home</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>

        <button class="theme-toggle" type="button" aria-pressed="false">
            Toggle Dark Mode
        </button>
    </header>

    <main>
        <section>
            <h2 id="welcome-heading">Welcome!</h2>
            <p>This is my website for the M5 JavaScript activity.</p>
            <p id="last-visit">This is your first visit.</p>
        </section>

        <section id="projects">
            <h2>My Projects</h2>
            <div id="content-list"></div>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>

            <form id="contact-form" novalidate>
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" autocomplete="name">
                    <small id="name-error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                    <small id="email-error"></small>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message"></textarea>
                    <small id="message-error"></small>
                </div>

                <button type="submit">Send Message</button>
                <p id="form-status" aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>
</html>
